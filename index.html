<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="ProdutivOS: um desktop satírico anti-procrastinação inspirado em web OSes clássicos.">
  <title>ProdutivOS 93</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Cpath d='M8 10h48v39H8z' fill='%23bbb' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M13 16h38v26H13z' fill='%23000'/%3E%3Cpath d='M23 22l19 7-9 4-4 9z' fill='%23b6ff00'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop" class="desktop" aria-label="Área de trabalho do ProdutivOS 93">
    <div id="desktopIcons" class="desktop-icons" aria-label="Ícones da área de trabalho"></div>
    <div id="windowLayer" class="window-layer" aria-live="polite"></div>

    <aside id="urubu" class="urubu-buddy" aria-label="Urubu, assistente de produtividade">
      <button id="urubuBubble" class="urubu-bubble" aria-label="Mensagem do Urubu">...</button>
      <div id="urubuAccessory" class="urubu-accessory" aria-hidden="true"></div>
      <img id="urubuImage" src="assets/urubu.png" alt="Urubu, o fiscal de produtividade" draggable="false">
    </aside>

    <div id="cursorGhost" class="cursor-ghost" aria-hidden="true">➤</div>
    <div id="toastLayer" class="toast-layer" aria-live="assertive"></div>
    <div id="contextMenu" class="context-menu" hidden></div>

    <nav id="startMenu" class="start-menu" aria-label="Menu Iniciar" hidden></nav>
    <footer class="taskbar" aria-label="Barra de tarefas">
      <button id="startBtn" class="start-button" aria-expanded="false"><span class="mini-logo">P</span> Iniciar</button>
      <div id="taskButtons" class="task-buttons"></div>
      <div class="tray">
        <button id="soundBtn" class="tray-icon" aria-pressed="false" title="Som">🔇</button>
        <button id="creditsBtn" class="credits-tray" title="Créditos de produtividade"><span>₱</span><output id="pointsTop">120</output></button>
        <button id="chaosBtn" class="tray-icon" title="Nível de irritação do Urubu">U1</button>
        <time id="clock">00:00</time>
      </div>
    </footer>
  </main>
  <div id="shutdownOverlay" class="shutdown-overlay" hidden></div>
  <div id="youtubeAudio" class="youtube-audio" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
